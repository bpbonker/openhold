# Local development database. Start with:
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openhold
      POSTGRES_USER: openhold
      POSTGRES_PASSWORD: openhold-dev
    ports:
      - "5433:5432"
    volumes:
      - openhold-pg:/var/lib/postgresql/data

volumes:
  openhold-pg:
