name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Integration tests start their own PostgreSQL with Testcontainers (Docker is on the runner).
      - run: dotnet test tests/Openhold.Core.Tests
      - run: dotnet test tests/Openhold.Server.Tests

  docker-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openhold-server .

  windows-clients:
    name: Windows clients
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Explorer, the job worker, the import tool and the add-ins compile against Inventor's or AutoCAD's programming
      # interface, which Openhold never ships, so CI builds the Windows projects that don't.
      - run: dotnet build src/Openhold.Client.Sdk
      - run: dotnet build src/Openhold.Client.Ui
      - run: dotnet build src/Openhold.Admin
