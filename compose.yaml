# Openhold server and its database. Copy .env.example to .env, set a database password, then:
#   docker compose up -d
# Full guide: docs/install/docker.md

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: openhold
      POSTGRES_USER: openhold
      POSTGRES_PASSWORD: ${OPENHOLD_DB_PASSWORD:?Set OPENHOLD_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhold -d openhold"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: openhold-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OPENHOLD_PORT:-8080}:8080"
    environment:
      Openhold__SiteId: ${OPENHOLD_SITE_ID:-HQ}
      Openhold__SiteName: ${OPENHOLD_SITE_NAME:-Head office}
      Openhold__PublicUrl: ${OPENHOLD_PUBLIC_URL:-}
      Openhold__Administrators__0: ${OPENHOLD_ADMIN:-admin}
      Openhold__Vaults__0__Name: Production
      Openhold__Vaults__0__Primary: Host=db;Database=openhold;Username=openhold;Password=${OPENHOLD_DB_PASSWORD}
      Openhold__Vaults__0__ChunkStorePath: /data/chunks/production
      OPENHOLD_INITIAL_ADMIN_PASSWORD: ${OPENHOLD_INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - data:/data

volumes:
  db:
  data:
